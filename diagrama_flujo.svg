<title id="title">Pipeline inicial del Laboratorio 11</title>
<desc id="desc">Fuente mensual y configuración pasan por lectura, seis controles, preparación, evaluación y generación de candidatas. Un fallo o rechazo conserva la versión aprobada anterior. La conexión del manifiesto con el tablero queda pendiente para el final.</desc>
